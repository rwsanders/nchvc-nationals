name: Refresh brackets

on:
  # All times UTC (Central = UTC-5 in October). GitHub can start scheduled runs a few minutes late.
  schedule:
    # Hourly test pulls until tournament morning: Tue Oct 13 7 PM CT -> Thu Oct 15 5 AM CT
    - cron: "7 * 14 10 *"
    - cron: "7 0-10 15 10 *"
    # Tournament: every 5 minutes, Thu Oct 15 6 AM CT -> Sun Oct 18 1 AM CT
    - cron: "*/5 11-23 15 10 *"
    - cron: "*/5 * 16-17 10 *"
    - cron: "*/5 0-5 18 10 *"
    # Wind-down: hourly for the rest of Sunday Oct 18, then once a day
    - cron: "7 6-23 18 10 *"
    - cron: "0 12 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Keep the last good downloads so a Google hiccup doesn't take the site down
      - uses: actions/cache@v4
        with:
          path: .cache
          key: sheets-${{ github.run_id }}
          restore-keys: sheets-

      # The data already live is the last good copy: a sheet that fails to parse keeps it,
      # and the new scrape is compared against it before deploying.
      - name: Fetch live data
        run: curl -sf --max-time 30 "$SITE_URL/data.json" -o prev_data.json || echo "no live data yet"
        env:
          SITE_URL: https://witty-ground-0124a1610.5.azurestaticapps.net

      - name: Pull sheets
        run: python nchvc_scrape.py --previous prev_data.json

      - name: Sanity check against live data
        run: python check_data.py data.json prev_data.json

      - name: Build site
        run: |
          python simulate_demo.py || echo "::warning::demo page skipped (simulate_demo.py failed)"
          python build_page.py --site

      - name: Deploy to Azure Static Web Apps
        if: ${{ env.SWA_TOKEN != '' }}
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          skip_app_build: true
